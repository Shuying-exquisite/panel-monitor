<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 在线状态管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: #eef3fb; color: #1f2b45;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 100%; max-width: 860px; min-height: 470px; display: grid; grid-template-columns: 1fr 1fr;
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(16, 42, 90, .16);
  }
  .brand-side {
    position: relative; padding: 42px 38px; color: #fff; overflow: hidden;
    background: linear-gradient(160deg, #0a3b91, #1565d8);
    display: flex; flex-direction: column;
  }
  .brand-side::after {
    content: ""; position: absolute; right: -70px; top: -70px; width: 230px; height: 230px;
    border-radius: 50%; background: rgba(255, 255, 255, .08);
  }
  .brand-logo {
    width: 46px; height: 46px; border-radius: 13px; background: rgba(255, 255, 255, .18);
    display: grid; place-items: center; margin-bottom: auto; position: relative; z-index: 2;
  }
  .brand-logo svg { width: 25px; height: 25px; }
  .brand-side h1 { margin: 30px 0 6px; font-size: 24px; letter-spacing: .5px; position: relative; z-index: 2; }
  .brand-side .sub { margin: 0; font-size: 12.5px; opacity: .78; position: relative; z-index: 2; }
  .brand-desc { margin: 26px 0 34px; font-size: 12.5px; line-height: 1.9; opacity: .85; position: relative; z-index: 2; max-width: 260px; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 96px; }
  .form-side { padding: 46px 40px; display: flex; flex-direction: column; justify-content: center; }
  .form-side h2 { margin: 0 0 6px; font-size: 21px; }
  .form-side .tip { margin: 0 0 26px; font-size: 12.5px; color: #8b9ab4; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #4a5a74; margin-bottom: 7px; }
  .field input[type=text], .field input[type=password] {
    width: 100%; height: 40px; padding: 0 12px; border: 1px solid #e1e8f3; border-radius: 9px;
    background: #fbfcff; color: #1f2b45; font-size: 13px; transition: all .16s;
  }
  .field input:focus { outline: none; border-color: #2f8bff; background: #fff; box-shadow: 0 0 0 3px rgba(47, 139, 255, .12); }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #7b8aa4; margin: 2px 0 20px; }
  .row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .row input { accent-color: #2f8bff; }
  .err { min-height: 18px; font-size: 12px; color: #e0484d; margin-bottom: 8px; }
  .btn {
    width: 100%; height: 42px; border: none; border-radius: 9px; cursor: pointer;
    background: linear-gradient(135deg, #3b9bff, #2563eb); color: #fff;
    font-size: 14px; font-weight: 650; letter-spacing: 2px;
    box-shadow: 0 6px 16px rgba(37, 99, 235, .26); transition: all .16s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:disabled { opacity: .65; cursor: wait; transform: none; }
  .foot { margin-top: 22px; text-align: center; font-size: 11px; color: #a3b0c4; }
  @media (max-width: 700px) {
    .page { grid-template-columns: 1fr; max-width: 400px; }
    .brand-side { padding: 26px; min-height: 170px; }
    .brand-side h1 { margin-top: 18px; }
    .brand-desc { display: none; }
    .form-side { padding: 30px 26px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand-side">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19H6a4 4 0 0 1-.6-7.95A6 6 0 0 1 17 9.5a4.5 4.5 0 0 1 .5 9.5Z"/>
      </svg>
    </div>
    <h1>在线状态管理</h1>
    <p class="sub">Web监控 &amp; 管理</p>
    <div class="brand-desc">统一监测面板类服务的在线状态、响应时间与可用性趋势，只有在线的服务才开放访问。</div>
    <svg class="wave" viewBox="0 0 400 96" preserveAspectRatio="none">
      <path d="M0 56c70-42 120 24 200 4s130-70 200-28v64H0Z" fill="rgba(255,255,255,.07)"/>
      <path d="M0 72c70-32 130 16 200 0s130-46 200-16v40H0Z" fill="rgba(255,255,255,.09)"/>
    </svg>
  </div>

  <div class="form-side">
    <h2>欢迎回来</h2>
    <p class="tip">请登录以继续访问仪表盘</p>
    <form id="form" autocomplete="on">
      <div class="field">
        <label for="user">账号</label>
        <input id="user" type="text" autocomplete="username" value="admin" required>
      </div>
      <div class="field">
        <label for="pwd">密码</label>
        <input id="pwd" type="password" autocomplete="current-password" placeholder="请输入访问密码" required>
      </div>
      <div class="row">
        <label><input type="checkbox" id="remember" checked> 记住登录状态（7 天）</label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="submit" type="submit">登 录</button>
    </form>
    <div class="foot">面板在线监测台 v2.0 · 仅限授权访问</div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('form');
  var err = document.getElementById('err');
  var submit = document.getElementById('submit');

  // 已登录或未启用认证时直接进仪表盘
  fetch('/api/session').then(function (r) { return r.json(); }).then(function (d) {
    if (!d.auth_enabled || d.logged_in) location.replace('/');
  }).catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    submit.disabled = true;
    submit.textContent = '登录中…';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value.trim(),
        password: document.getElementById('pwd').value,
        remember: document.getElementById('remember').checked
      })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.ok) { location.replace('/'); return; }
        err.textContent = (res.d && res.d.error) || '登录失败，请重试';
        submit.disabled = false;
        submit.textContent = '登 录';
      }).catch(function () {
        err.textContent = '无法连接服务，请稍后重试';
        submit.disabled = false;
        submit.textContent = '登 录';
      });
  });

  setTimeout(function () { document.getElementById('pwd').focus(); }, 100);
})();
</script>
</body>
</html>
